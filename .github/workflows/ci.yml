name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    name: 타입·린트·빌드·단위 테스트
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run build
      - name: Workers 번들 빌드 + 크기 확인 (무료 플랜 3MB)
        run: npm run build:cf && npm run size:cf

  e2e:
    name: 브라우저 E2E (실제 PostgreSQL)
    runs-on: ubuntu-latest
    # 브라우저가 미리 설치된 공식 이미지를 쓴다 (설치 시간·실패 요인 제거)
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cavero
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # 서비스 컨테이너는 호스트 이름으로 접근한다
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/cavero
      DB_AUTO_MIGRATE: "1"
      AI_PROVIDER: mock
      ALLOW_PRIVATE_FETCH: "1"
      CRON_KEY: ci-cron-key
      BASE: http://localhost:3000
      # 가짜 구글 서버(tests/mocks/google.mjs)를 가리킨다
      GOOGLE_CLIENT_ID: test-client-id.apps.googleusercontent.com
      GOOGLE_CLIENT_SECRET: test-secret
      GOOGLE_AUTH_ENDPOINT: http://localhost:8790/auth
      GOOGLE_TOKEN_ENDPOINT: http://localhost:8790/token
      ADMIN_EMAILS: admin@cavero.test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: 앱 기동
        run: |
          npx next start &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:3000/login && exit 0
            sleep 2
          done
          echo "앱이 뜨지 않았습니다"; exit 1
      - name: 가짜 외부 서버 기동 (구글 OAuth · 공고 사이트 · 공고 목록)
        run: sh tests/mocks/start.sh
      # 묶음 목록은 package.json 의 test:e2e 하나에서만 관리한다.
      # 여기에 따로 나열했더니 새 묶음이 추가될 때마다 빠져서 10개가 CI 밖에 있었다.
      - name: 브라우저 E2E 전체
        shell: bash
        run: npm run test:e2e 2>&1 | tee e2e.log
      # 로그 전문을 열지 않아도 무엇이 깨졌는지 보이도록, 실패 항목을 주석으로 올린다
      - name: 실패 항목을 주석으로 남기기
        if: failure()
        shell: bash
        run: |
          {
            grep -E "^❌|^ *- .*\(예외|Error:|Timeout [0-9]+ms" e2e.log | head -15
            echo "--- 마지막 출력 ---"
            tail -12 e2e.log
          } | sed 's/^/::error title=E2E 실패::/'

